[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapen-analise"
version = "0.1.0"
description = "MAPEN - camada de dados e modelagem de redflags de perda energetica"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "openpyxl",
    "matplotlib",
    "huggingface_hub",
    "xgboost",
    "lightgbm",
    "scikit-learn",
    "shap",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "pandas-stubs", "types-PyYAML"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["mapen_aconselhamento*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/mapen_aconselhamento"]
