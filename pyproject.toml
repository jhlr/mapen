[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapen-analise"
version = "0.1.0"
description = "MAPEN - camada de dados e modelagem de redflags de perda energetica"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "openpyxl",
    "matplotlib",
    "huggingface_hub",
    "xgboost",
    "lightgbm",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = []
