[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapen-cv"
version = "0.1.0"
description = "MAPEN - subprojeto de visao computacional: leitura e validacao de fotos de medidores (TrOCR/PP-OCR)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "datasets",
    "accelerate",
    "sentencepiece",
    "tokenizers",
    "pandas",
    "pyarrow",
    "duckdb",
    "pillow",
    "mlflow",
]

[project.scripts]
mapen-cv = "mapen_cv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
